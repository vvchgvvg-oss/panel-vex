version: "3.8"
services:
  vps-panel:
    build: .
    image: vps-panel:latest
    container_name: ziad-vps-panel
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
      # 🐳 العزل: auto (حاوية لكل ملف إن توفر Docker) | docker | sandbox
      - ISO_MODE=auto
      - ISO_MEMORY=512m
      - ISO_CPUS=0.5
      - ISO_PIDS=128
      # bridge = إنترنت متاح للبوتات، none = بدون إنترنت
      - ISO_NETWORK=none
      - ISO_IMAGE_PY=python:3.11-slim
      - ISO_IMAGE_NODE=node:20-alpine
    volumes:
      - panel_data:/app/panel_data
      # 🐳 لتشغيل حاوية لكل ملف على VPS، أزل التعليق عن السطر التالي:
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - panel_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
volumes:
  panel_data:
    driver: local
networks:
  panel_network:
    driver: bridge
